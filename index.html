<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FNF 6th Anniversary!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f23;
    font-family: 'Arial Black', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(45deg, #1a0533, #0f0f23, #0d1b2a, #1a0533);
    background-size: 400% 400%;
    animation: bgShift 8s ease infinite;
    z-index: -1;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .title {
    font-size: 28px;
    color: #fff;
    text-align: center;
    text-shadow: 0 0 20px #e94560, 0 0 40px #e94560;
    animation: pulse 1.5s ease-in-out infinite;
  }
  .title span { color: #53d8fb; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .anniversary {
    font-size: 120px;
    color: #e94560;
    text-shadow: 0 0 30px #e94560, 0 0 60px #ff6b9d;
    animation: bounce 2s ease infinite;
    margin: 10px 0;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-20px) rotate(-3deg); }
    75% { transform: translateY(-10px) rotate(3deg); }
  }

  .subtitle {
    color: #aaa;
    font-size: 16px;
    text-align: center;
    margin-bottom: 30px;
  }

  .characters {
    display: flex;
    gap: 20px;
    margin: 20px 0;
  }
  .char {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    animation: charBounce 1s ease infinite;
    border: 3px solid;
  }
  .char:nth-child(1) { background: #1a3a6b; border-color: #53d8fb; animation-delay: 0s; }
  .char:nth-child(2) { background: #6b1a3a; border-color: #ff6b9d; animation-delay: 0.2s; }
  .char:nth-child(3) { background: #3a1a6b; border-color: #b388ff; animation-delay: 0.4s; }
  .char:nth-child(4) { background: #1a6b3a; border-color: #69f0ae; animation-delay: 0.6s; }
  @keyframes charBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .note {
    position: fixed;
    font-size: 24px;
    animation: fall linear infinite;
    opacity: 0.8;
  }
  @keyframes fall {
    0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  .timeline {
    position: fixed;
    bottom: 20px;
    color: #666;
    font-size: 12px;
    text-align: center;
  }
  .timeline span { color: #53d8fb; }

  .hint {
    color: #555;
    font-size: 13px;
    margin-top: 20px;
    animation: blink 2s ease infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>
  <div class="title">FRIDAY NIGHT <span>FUNKIN'</span></div>
  <div class="anniversary">6</div>
  <div class="subtitle">2020.10.05 → 2026.10.05 · 6th Anniversary</div>

  <div class="characters">
  <img src="bf.png" class="char">
  <img src="dad.webp" class="char">
  <img src="gf.webp" class="char">
  <img src="mum.webp" class="char">
  </div>

  <div class="hint">点击屏幕释放音符！</div>

  <div class="timeline">
    Week 1 → Week 7 已发布 · <span>Week 8 即将来袭</span> · 故事还在继续
  </div>

  <script>
    document.addEventListener('click', (e) => {
      const notes = [
  '<img src="down_edit_572665372084246.png">',
  '<img src="left_edit_572692566424652.png">',
  '<img src="right_edit_572678847612053.png">',
  '<img src="up_edit_572657002452218.png">'
];
      for (let i = 0; i < 5; i++) {
        const note = document.createElement('div');
        note.className = 'note';
        note.innerHTML = notes[Math.floor(Math.random() * notes.length)];
        note.style.left = (e.clientX + (Math.random() - 0.5) * 100) + 'px';
        note.style.top = e.clientY + 'px';
        note.style.animationDuration = (1 + Math.random() * 2) + 's';
        document.body.appendChild(note);
        setTimeout(() => note.remove(), 3000);
      }
    });

    setInterval(() => {
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = ['🎵', '🎶', '✨'][Math.floor(Math.random() * 3)];
      note.style.left = Math.random() * window.innerWidth + 'px';
      note.style.animationDuration = (3 + Math.random() * 4) + 's';
      document.body.appendChild(note);
      setTimeout(() => note.remove(), 7000);
    }, 800);
  </script>
</body>
</html>
